name: Swift
on: [push]
jobs:

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Swift
      uses: SwiftyLab/setup-swift@latest
      with:
        swift-version: "6.4.2"
    - name: Swift Version
      run: swift --version
    - name: Install dependencies
      run: brew install cairo fontconfig freetype
    - name: Check libCoreGraphics' generated stubs and export lists
      run: python3 Scripts/CoreGraphics/gen_stubs.py --check
    - name: Build (Debug)
      run: swift build -c debug
    - name: Build (Release)
      run: swift build -c release
    - name: Test (Debug)
      run: swift test -c debug --traits Cairo,Quartz,Nintendo3DS

  linux:
    name: Linux (${{ matrix.container }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container: ["swift:6.4.2-trixie"]
    container: ${{ matrix.container }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Swift Version
      run: swift --version
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          libcairo2-dev libfreetype-dev libfontconfig-dev \
          fontconfig fonts-liberation fonts-dejavu-core pkg-config
    - name: Build (Debug)
      run: swift build -c debug
    - name: Build (Release)
      run: swift build -c release
    - name: Test (Debug)
      run: swift test -c debug

  cmake-macos:
    name: CMake (macOS)
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Swift
      uses: SwiftyLab/setup-swift@latest
      with:
        swift-version: "6.4.2"
    - name: Install dependencies
      run: brew install ninja
    - name: Configure
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_SYSROOT="$(xcrun --sdk macosx --show-sdk-path)"
    - name: Build
      # Silica and its Core Graphics backend, as shared libraries
      run: cmake --build build
    - name: Install
      run: cmake --install build --prefix "$PWD/stage"

  cmake-linux:
    name: CMake (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4.2-trixie
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          cmake ninja-build git pkg-config \
          libcairo2-dev libfreetype-dev libfontconfig-dev
    - name: Build the Cairo and FontConfig Swift modules
      # the Cairo backend imports them, and they have no CMake build
      run: .github/scripts/build-cairo-modules.sh "$PWD/modules"
    - name: Configure
      run: |
        flags="-I $PWD/modules -L $PWD/modules"
        for flag in $(pkg-config --cflags cairo fontconfig freetype2); do
          flags="$flags -Xcc $flag"
        done
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_Swift_FLAGS="$flags"
    - name: Build
      # Silica, its Cairo backend, and libCoreGraphics, as shared libraries
      run: cmake --build build
    - name: Check libCoreGraphics' exports
      run: Scripts/CoreGraphics/check_exports.sh build/lib/libCoreGraphics.so
    - name: Check libCoreGraphics against Apple's CoreGraphics
      # the programs' output from Apple's framework is recorded in Conformance/CoreGraphics/expected
      # (libCoreGraphics draws with SilicaCairo, which needs the Cairo module's library)
      run: LD_LIBRARY_PATH="$PWD/modules" CC=clang Scripts/CoreGraphics/conformance.sh check build/lib
    - name: Install
      run: cmake --install build --prefix "$PWD/stage"

  wasm:
    name: WebAssembly (${{ matrix.swift-sdk }})
    runs-on: ubuntu-latest
    container: swift:6.4.2-trixie
    strategy:
      fail-fast: false
      matrix:
        # regular and Embedded Swift WebAssembly SDKs
        swift-sdk: ['swift-6.4.2-RELEASE_wasm', 'swift-6.4.2-RELEASE_wasm-embedded']
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Swift Version
      run: swift --version
    - name: Install Swift SDK for WebAssembly
      run: |
        swift sdk install \
          https://download.swift.org/swift-6.4.2-release/wasm-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_wasm.artifactbundle.tar.gz \
          --checksum 83baca83553f8c443cda7b84800912e6e709c3acd2e7ebf277794ca5836c0da5
        swift sdk list
    - name: Build
      run: swift build --swift-sdk ${{ matrix.swift-sdk }} --target SilicaWeb --traits Web
    - name: Build Example
      # the Embedded SDK needs the Unicode data tables linked explicitly; see Examples/WebCanvasDemo/Package.swift
      # (this container's `run:` steps use `sh`, not `bash`, hence `case` instead of `[[ ... ]]`)
      run: |
        case "${{ matrix.swift-sdk }}" in
          *embedded) export SILICA_WASM_EMBEDDED=1 ;;
        esac
        swift build --package-path Examples/WebCanvasDemo --swift-sdk ${{ matrix.swift-sdk }}

  android:
    name: Android (API ${{ matrix.api }}, ${{ matrix.arch }})
    runs-on: ubuntu-24.04
    container: swift:6.4.2-trixie
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api: [28, 31]
        arch: [aarch64, x86_64]
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install the Android NDK
      run: |
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl unzip
        curl -fsSL https://dl.google.com/android/repository/android-ndk-r30-linux.zip -o /tmp/android-ndk.zip
        unzip -q /tmp/android-ndk.zip -d /opt
        echo "ANDROID_NDK_HOME=/opt/android-ndk-r30" >> "$GITHUB_ENV"
    - name: Install the Swift SDK for Android
      run: |
        swift sdk install \
          https://download.swift.org/swift-6.4.2-release/android-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_android.artifactbundle.tar.gz \
          --checksum 4d6ad63ea74becd58e123ff58b1b48c3be5ec0db0dff0ea5abe37ac007dd3233
    - name: Build Silica
      run: |
        swift build --swift-sdk swift-6.4.2-RELEASE_android \
          --triple ${{ matrix.arch }}-unknown-linux-android${{ matrix.api }} \
          --target Silica --disable-default-traits
