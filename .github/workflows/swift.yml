name: Swift
on: [push]
jobs:

  macos:
    name: macOS
    runs-on: macos-latest
    env:
      # Lets the test bundle link FT_* until PureSwift/Cairo#9 (which fixes
      # CFreeType's pkg-config module name, so SwiftPM emits this search
      # path itself) lands on Cairo master; harmless afterwards.
      LIBRARY_PATH: /opt/homebrew/lib
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Swift Version
      run: swift --version
    - name: Install dependencies
      run: brew install cairo fontconfig freetype
    - name: Build (Debug)
      run: swift build -c debug
    - name: Build (Release)
      run: swift build -c release
    - name: Test (Debug)
      # exercises both the CoreGraphics and Cairo backends
      run: swift test -c debug

  linux:
    name: Linux (${{ matrix.container }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container: ["swift:latest"]
    container: ${{ matrix.container }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Swift Version
      run: swift --version
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          libcairo2-dev libfreetype-dev libfontconfig-dev \
          fontconfig fonts-liberation fonts-dejavu-core pkg-config
    - name: Build (Debug)
      run: swift build -c debug
    - name: Build (Release)
      run: swift build -c release
    - name: Test (Debug)
      run: swift test -c debug

  wasm:
    name: WebAssembly (${{ matrix.swift-sdk }})
    runs-on: ubuntu-latest
    container: swift:6.3.3
    strategy:
      fail-fast: false
      matrix:
        # regular and Embedded Swift WebAssembly SDKs
        swift-sdk: ['swift-6.3.3-RELEASE_wasm', 'swift-6.3.3-RELEASE_wasm-embedded']
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Swift Version
      run: swift --version
    - name: Install Swift SDK for WebAssembly
      run: |
        swift sdk install \
          https://download.swift.org/swift-6.3.3-release/wasm-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_wasm.artifactbundle.tar.gz \
          --checksum cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7
        swift sdk list
    - name: Build
      run: swift build --swift-sdk ${{ matrix.swift-sdk }} --target SilicaWeb
    - name: Build Example
      # the Embedded SDK needs the Unicode data tables linked explicitly; see Examples/WebCanvasDemo/Package.swift
      run: |
        env $( [[ "${{ matrix.swift-sdk }}" == *embedded ]] && echo SILICA_WASM_EMBEDDED=1 ) \
          swift build --package-path Examples/WebCanvasDemo --swift-sdk ${{ matrix.swift-sdk }}

  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        android-sdk: ['nightly-6.3']
        android-api: ['28', '31']
        android-ndk: ['r27d']
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup Swift Android SDK
      uses: skiptools/actions/setup-skip@v1
      with:
        gradle-version: 'none'
        install-swift-android-sdk: true
        swift-android-sdk-version: ${{ matrix.android-sdk }}
        swift-android-ndk-version: ${{ matrix.android-ndk }}
    - name: Build Swift Package for Android (aarch64)
      run: |
        ANDROID_SDK_VERSION=${{ matrix.android-api }} skip android build --arch aarch64 --android-api-level ${{ matrix.android-api }}
    - name: Build Swift Package for Android (x86_64)
      run: |
        ANDROID_SDK_VERSION=${{ matrix.android-api }} skip android build --arch x86_64 --android-api-level ${{ matrix.android-api }}
    - name: Test Swift Package on Android
      # Canvas.drawGlyphs and swift-java's JVM lookup require API >= 31
      if: ${{ matrix.android-api >= 31 }}
      continue-on-error: true
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ matrix.android-api }}
        arch: x86_64
        script: |
          ANDROID_SDK_VERSION=${{ matrix.android-api }} skip android test --android-api-level ${{ matrix.android-api }} --apk --verbose
